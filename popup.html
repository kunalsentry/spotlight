<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spotlight</title>
  <link rel="stylesheet" href="cue-editor.css">
  <style>
    /* Sentry (sentry.io) palette: dark violet text, blurple accent,
       rich-black surfaces in dark mode. */
    :root {
      --bg: #ffffff;
      --fg: #362d59;      /* dk-violet */
      --muted: #79628c;   /* lt-violet */
      --line: #ececf1;    /* gray-2 */
      --chip: #f6f6f8;
      --seg-on: #ffffff;
      --accent: #7553ff;  /* blurple */
      --track: #cfcfdb;   /* gray-3 */
      --cue: #fd44b0;     /* cues armed (pink, like the badge) */
      --danger: #c73852;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1633;    /* rich-black */
        --fg: #ffffff;
        --muted: #9093c1;
        --line: #362d59;
        --chip: #181225;  /* utility-black */
        --seg-on: #362d59;
        --track: #362d59;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 300px; padding: 10px 16px 12px;
      background: var(--bg); color: var(--fg);
      font: 13px/1.4 Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .top { display: flex; align-items: center; justify-content: space-between; }
    .top h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .top small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }

    .switch { position: relative; width: 34px; height: 20px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--track); transition: background 150ms; pointer-events: none; }
    .switch span::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: transform 150ms; box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    body.unavailable .switch { opacity: .4; pointer-events: none; }

    .controls { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 10px; }
    .row[hidden] { display: none; }
    .row > span { color: var(--muted); font-size: 12px; }

    .seg { display: flex; background: var(--chip); border-radius: 7px; padding: 2px; }
    .seg button {
      flex: 1; font: inherit; font-size: 12px; color: var(--muted); background: none;
      border: 0; border-radius: 5px; padding: 4px 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .seg.toggles { gap: 2px; }
    /* On/off toggles (each independent): solid accent when on. */
    .seg.toggles button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }
    .swatches { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
    .swatches button, .swatches .custom {
      width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
      background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); position: relative;
    }
    .swatches .custom { background: conic-gradient(#fd44b0, #ffdb4a, #c2ef4e, #7553ff, #fd44b0); overflow: hidden; }
    .swatches .custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: 0; padding: 0; }
    .swatches [aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .swatches button:focus-visible, .swatches .custom:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
    .glyph { width: 12px; height: 12px; border: 1.5px solid currentColor; }
    .glyph.circle { border-radius: 50%; }
    .glyph.rounded { width: 15px; border-radius: 3.5px; }

    .slider { display: grid; grid-template-columns: 1fr 38px; align-items: center; gap: 8px; }
    .slider output { text-align: right; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }

    /* Tabs: Spotlight | Cues */
    .tabs { display: flex; gap: 2px; margin: 0 -4px 12px; border-bottom: 1px solid var(--line); }
    .tabs button {
      font: inherit; font-size: 12.5px; font-weight: 500; color: var(--muted); background: none; border: 0;
      padding: 6px 8px 8px; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
    .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
    .tabs .pill { font-size: 10px; font-weight: 600; color: #fff; background: var(--cue); border-radius: 999px; padding: 1px 6px; }
    .tabs .pill[hidden] { display: none; }
    [role="tabpanel"][hidden] { display: none; }

    .cues { display: grid; gap: 10px; }
    .btn {
      font: inherit; font-size: 12px; color: var(--fg); background: var(--chip); border: 0; border-radius: 6px;
      padding: 4px 9px; cursor: pointer;
    }
    .btn:hover { color: var(--accent); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { color: #fff; filter: brightness(1.1); }
    .cue-actions { display: flex; gap: 6px; align-items: center; }
    .cue-actions a { margin-left: auto; font-size: 11.5px; color: var(--muted); text-decoration: none; }
    .cue-actions a:hover { color: var(--fg); }
    .list-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--muted); }
    .list-head button { font: inherit; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
    .list-head button:hover { color: var(--fg); }
    .cue-list { max-height: 340px; overflow-y: auto; margin: 0 -2px; padding: 0 2px; }
    .cue-list .empty { color: var(--muted); font-size: 12px; padding: 10px 0; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
    .seg.sizes button { font-variant-numeric: tabular-nums; }
    .seg button[hidden] { display: none; }
    #viewport { font-size: 11px; color: var(--muted); }
    body.unavailable .page-only { opacity: .4; pointer-events: none; }

    .foot {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--muted);
    }
    .foot a { color: var(--muted); text-decoration: none; }
    .foot a:hover { color: var(--fg); }
    kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
  </style>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-spotlight" aria-controls="panel-spotlight" aria-selected="true">Spotlight</button>
    <button role="tab" id="tab-cues" aria-controls="panel-cues" aria-selected="false">Cues <span class="pill" id="armedPill" hidden>Armed</span></button>
  </nav>

  <section role="tabpanel" id="panel-spotlight" aria-labelledby="tab-spotlight">
  <div class="top">
    <div>
      <h1>Spotlight</h1>
      <small id="status">Off</small>
    </div>
    <label class="switch"><input type="checkbox" id="spotlight" aria-label="Spotlight"><span></span></label>
  </div>

  <div class="controls">
    <div class="row">
      <span>Shape</span>
      <div class="seg" data-setting="shape">
        <button data-value="circle"><i class="glyph circle"></i>Circle</button>
        <button data-value="rounded"><i class="glyph rounded"></i>Box</button>
      </div>
    </div>
    <label class="row">
      <span id="widthLabel">Size</span>
      <div class="slider"><input type="range" id="width" min="60" max="2560" step="10"><output id="widthOut"></output></div>
    </label>
    <label class="row" id="heightRow">
      <span>Height</span>
      <div class="slider"><input type="range" id="height" min="60" max="2560" step="10"><output id="heightOut"></output></div>
    </label>
    <div class="row">
      <span>Effect</span>
      <div class="seg" data-setting="effect">
        <button data-value="dim">Dim</button>
        <button data-value="blur">Blur</button>
        <button data-value="blur-dim">Both</button>
      </div>
    </div>
    <label class="row">
      <span>Strength</span>
      <div class="slider"><input type="range" id="strength" min="0" max="100" step="1"><output id="strengthOut"></output></div>
    </label>
    <div class="row">
      <span>Ink</span>
      <div class="swatches" data-setting="inkColor">
        <button data-value="#fd44b0" style="--c:#fd44b0" aria-label="Pink"></button>
        <button data-value="#7553ff" style="--c:#7553ff" aria-label="Blurple"></button>
        <button data-value="#ffdb4a" style="--c:#ffdb4a" aria-label="Yellow"></button>
        <button data-value="#c2ef4e" style="--c:#c2ef4e" aria-label="Lime"></button>
        <button data-value="#ffffff" style="--c:#ffffff" aria-label="White"></button>
        <label class="custom" title="Custom colour"><input type="color" id="inkCustom" aria-label="Custom ink colour"></label>
      </div>
    </div>
    <div class="row">
      <span title="Zoom in automatically">Zoom</span>
      <div class="seg toggles">
        <button data-toggle="autoZoomPlace" title="Zoom in as soon as you click to place the spotlight">On place</button>
        <button data-toggle="autoZoomResize" title="Zoom in when you finish resizing the spotlight">After resize</button>
      </div>
    </div>
    <div class="row">
      <span title="Clicks outside a placed spotlight">Outside</span>
      <div class="seg toggles">
        <button data-toggle="blockOutside" title="Keep clicks and scrolling outside a placed spotlight from reaching the page">Block clicks</button>
        <button data-toggle="closeOnOutside" title="Turn the spotlight off when you click outside it">Click closes</button>
      </div>
    </div>
  </div>

  </section>

  <section role="tabpanel" id="panel-cues" aria-labelledby="tab-cues" class="cues" hidden>
    <div class="top">
      <div>
        <h1>Cues</h1>
        <small id="cuesStatus">Off</small>
      </div>
      <label class="switch"><input type="checkbox" id="cuesArmed" aria-label="Arm cues"><span></span></label>
    </div>
    <div class="cue-actions">
      <button class="btn primary page-only" id="recordCue" title="Click an element, then place the spotlight it should show">Record cue</button>
      <a href="#" id="manageCues">Open cue manager</a>
    </div>
    <div>
      <div class="list-head"><span id="listTitle">On this page</span><button id="showAll" hidden></button></div>
      <div class="cue-list" id="cueList"></div>
    </div>
    <div class="row page-only" title="Resize this window to check how cues adapt">
      <span>Test at</span>
      <div class="seg sizes" id="sizes">
        <button data-size="1280x800" title="1280 × 800 window">1280</button>
        <button data-size="1440x900" title="1440 × 900 window">1440</button>
        <button data-size="1920x1080" title="1920 × 1080 window">1920</button>
        <button data-size="restore" id="restoreSize" title="Back to the original window size" hidden>↺</button>
      </div>
    </div>
    <div id="viewport"></div>
  </section>

  <div class="foot">
    <span><kbd id="toggleKey">⌥S</kbd> spotlight · hold <kbd>⌥D</kbd> to draw</span>
    <a href="#" id="editShortcuts" title="Change keyboard shortcut">Shortcut</a>
  </div>

  <script src="cue-model.js"></script>
  <script src="cue-editor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
